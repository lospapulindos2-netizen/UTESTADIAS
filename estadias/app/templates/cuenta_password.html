{% extends "base.html" %}
{% block titulo %}Cambiar contraseña{% endblock %}
{% block contenido %}
<h1 class="mb-5">Cambiar contraseña</h1>
<form method="post" class="card max-w-md space-y-4">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  {% if error %}<div class="alerta-error !mb-0">{{ error }}</div>{% endif %}
  <div><label class="label" for="actual">Contraseña actual</label>
    <input class="input" id="actual" name="actual" type="password" required autocomplete="current-password"></div>
  <div><label class="label" for="nueva">Nueva contraseña</label>
    <input class="input" id="nueva" name="nueva" type="password" required minlength="8" autocomplete="new-password">
    <p class="ayuda">Mínimo 8 caracteres, con letras y números.</p></div>
  <div><label class="label" for="confirmar">Confirmar nueva contraseña</label>
    <input class="input" id="confirmar" name="confirmar" type="password" required autocomplete="new-password"></div>
  <button class="btn-primario">Guardar</button>
</form>
{% endblock %}
